<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Focused palette. One idea only: a speech bubble (conversation) holding a
    voice wave (spoken). The previous icon carried two bubbles AND a wave, which
    at 32px — the size the Dock and menu bar actually use — collapsed into an
    unreadable smudge. Drop shadows were dropped for the same reason.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#3ED397"/>
      <stop offset="48%"  stop-color="#12885F"/>
      <stop offset="100%" stop-color="#06432F"/>
    </linearGradient>
    <!-- Barely-there top light so the tile is not flat. Too subtle to muddy
         the small sizes, unlike a blur or a drop shadow. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%"  stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Apple's 824/1024 icon grid -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <!-- Bubble, with the tail on the lower left so the mark sits optically centred. -->
  <path fill="#FFFFFF" d="M356 292 H668 A116 116 0 0 1 784 408 V562 A116 116 0 0 1 668 678
     H472 L330 772 L368 678 H356 A116 116 0 0 1 240 562 V408 A116 116 0 0 1 356 292 Z"/>

  <!-- Voice wave. Deep enough to hold its shape against white at 16px. -->
  <g fill="#07503A">
    <rect x="341" y="448" width="46" height="74"  rx="23"/>
    <rect x="415" y="409" width="46" height="152" rx="23"/>
    <rect x="489" y="380" width="46" height="210" rx="23"/>
    <rect x="563" y="415" width="46" height="140" rx="23"/>
    <rect x="637" y="443" width="46" height="84"  rx="23"/>
  </g>
</svg>
